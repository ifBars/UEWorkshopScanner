[package]
name = "ue-workshop-scanner-gui"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Player-friendly desktop frontend for UEWorkshopScanner"

[dependencies]
dioxus = { version = "0.7.2", features = ["desktop"] }
dioxus-desktop = "0.7.2"
rfd = "0.15.4"
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
ue-workshop-scanner = { path = ".." }
